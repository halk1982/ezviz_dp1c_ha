name: EZVIZ DP1C Cloud Video
version: 0.2.3
slug: ezviz_dp1c_video_probe
description: Experimental on-demand cloud live video, with a separate capture-test mode
url: https://github.com/halk1982/ezviz_dp1c_ha
arch:
  - amd64
  - aarch64
startup: application
boot: manual
init: false
map:
  - media:rw
ports:
  8558/tcp: 8558
ports_description:
  8558/tcp: Authenticated local MPEG-TS video
options:
  mode: probe
  video_mode: compatible
  decrypt_mode: auto
  stream_username: dp1c
  stream_password: ""
  max_view_seconds: 300
  account: ""
  password: ""
  serial: ""
  api_host: apiieu.ezvizlife.com
  verification_code: ""
  camera_verification_code: ""
  camera_key: ""
  decrypt_video: false
schema:
  mode: list(probe|live)
  video_mode: list(copy|compatible)
  decrypt_mode: list(auto|encrypted-header|h264-clear-header|hevc)
  stream_username: str
  stream_password: password
  max_view_seconds: int(30,900)
  account: str
  password: password
  serial: str
  api_host: str
  verification_code: password
  camera_verification_code: password
  camera_key: password
  decrypt_video: bool
